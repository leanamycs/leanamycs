name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Cleanup to free disk space
        # texlive-full (pulled below to build the blueprint) is large enough
        # that the runner's default free space isn't enough without this.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.0
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # blueprint needs full history for `leanblueprint`/checkdecls
      - uses: leanprover/lean-action@434f25c2f80ded67bba02502ad3a86f25db50709 # 2025-07-02
      - uses: leanprover-community/docgen-action@deed0cdc44dd8e5de07a300773eb751d33e32fc8 # 2025-10-26
        # Pinned past a specific commit rather than floating on @v1: the v1
        # release still ships the blueprint-build step with the old
        # `pip install --global-option=...` syntax, which newer pip (26.x)
        # rejects outright ("no such option"). This commit already has the
        # `--config-settings=` fix.
        with:
          blueprint: true
          homepage: home_page
